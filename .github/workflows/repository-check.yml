name: Repositorycontrole

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    name: Repositorycontrole
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Structuur, links en syntax controleren
        run: python scripts/check_repository.py
      - name: Interfacetest installeren zonder modellen
        run: python -m pip install streamlit==1.45.0
      - name: Interface controleren met AppTest
        run: python scripts/test_chef_ui.py
      - name: Whitespace controleren
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --format= --check HEAD
          fi
